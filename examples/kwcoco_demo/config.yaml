# kwcoco_demo — CPU smoke configuration.
# Every key here is a CLI argument to `python -m kwcoco_detector_kit run-all`.
category_names: widget
trainer: mock_tiny
variant: mock_tiny
tier: S
input_hw: [256, 256]
num_epochs: 2

tile:
  mode: multiscale
  tile_size: 256
  source_scales: [1.0, 0.66, 0.40]
  stride_frac: 0.5
  min_gt_area_frac: 0.005
  oversize_factor: 1.0   # 1.0 => same as model input; >1 reserves crop-aug margin

round_loop:
  num_rounds: 1
  round0_neg_over_pos: 1.0

export:
  onnx: true
  opset: 18
  package: false        # Phase 1 mock; no full package YAML
