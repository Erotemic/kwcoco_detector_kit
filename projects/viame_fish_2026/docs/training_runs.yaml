                 10: 0.522, 11: 0.522, 12: 0.531, 13: 0.529}
      best_epoch: 4
      best_ap: 0.5328529228246736
      best_stg2_written: false   # correct: no epoch >= stop_epoch beat the global best
    notes:
      - >-
        ZERO NaN aborts through 8 epochs, 7 of them augmented. All three fp16
        runs (gen001 e4, gen002 e1, gen005 e3) aborted inside an augmented
        epoch at stable loss; bf16 has not.
      - >-
        ZERO checkpoint reloads. gen004 took four (epochs 2, 7, 13, 19) because
        stop_epoch=1 froze best_stg1.pth at epoch 0, and never beat its own
        epoch-1 score in 21 epochs. With stop_epoch=12 the branch cannot fire
        before epoch 12 and best_stg1 accumulates the real best of 0-11.
      - >-
        Epoch 7 is the designed phase change -- flat LR ends, Mosaic and MixUp
        terminate. Loss fell 4.42 in one epoch (six times any previous step)
        because the training distribution got easier; vali never had Mosaic, so
        AP dipped to 0.5260. First fish run to reach such a transition at all.
      - >-
        PEAKED AT EPOCH 4 of 14, then declined monotonically to epoch 11
        (0.5329 -> 0.522) while training loss fell the whole way
        (33.20 -> 26.80). Loss down and vali down together is fitting the
        training distribution at the expense of generalisation, not a model
        still climbing. The pre-registered "under 0.530 at epoch 11 means the
        schedule was too short" criterion fired, but the completed curve does
        NOT support "too short" -- more of this schedule would most likely
        have produced more decline.
      - >-
        EPOCH 12 WAS A RESTORE, NOT A RECOVERY. The 0.522 -> 0.531 jump is
        det_solver's stage-2 mechanism reloading best_stg1.pth (epoch 4
        weights) at stop_epoch, then again after epoch 12 failed to beat it.
        Start-of-epoch loss confirms it: e11 starts at 25.69, e12 at 31.85,
        e13 at 33.03. So epochs 12 and 13 are each ONE clean NoAug epoch from
        epoch-4 weights -- hence identical end loss (31.02) and close scores.
        The informative result is negative: epoch-4 weights plus a clean
        low-LR NoAug epoch score 0.529-0.531, no better than epoch 4 alone.
        First fish run to reach a stop_epoch boundary at all.
      - >-
        NOT COMPARABLE to gen003's 0.5406. That was whole-image vali; this is
        tile-level. The staged checkpoints exist so gen001, gen003 and every
        gen006 epoch can be scored under one frozen protocol (true-tiled,
        1229px, full vali). Until that runs, gen006 is unmeasured rather than
        better or worse. Epochs 12-13 are worth scoring despite losing on
        tile-level AP: they are the only epochs trained in the clean NoAug
        regime that matches inference geometry.
      - >-
        Per-epoch staging is live and verified: 8 checkpoints in staging/ with
        8 matching epoch_staged events in journal/train.jsonl. This wiring had
        never run before -- pareto_sweep never passed selection_journal_dpath,
        and when it did it initially passed the STAGING dir, which put the
        journal where the reranker never looks while the .pth files landed
        correctly.
      - >-
        Every scientifically relevant setting is hard-pinned rather than
        defaulted, and stale exports (KCD_FLAT_EPOCH, KCD_INIT_CHECKPOINT,
        KCD_TRAIN_FROM_SCRATCH, KCD_FORCE_EVAL) are actively cleared. Several
        had been overridden by hand during debugging.

