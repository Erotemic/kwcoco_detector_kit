  - id: fishtrack23_deimv2_dinov3_x_4gpu_aiq_gen001
    status: partial
    purpose: >-
      Complementary box-only DEIMv2 detector for FishTrack23, trained through
      the kwcoco_detector_kit pipeline. Architecturally distinct from the
      existing RF-DETR model (DINOv3 backbone vs ViT; whole 1024px frames vs
      720px chips), and the first fish model on this corpus to be scored
      against genuinely held-out data.
    entrypoint: scripts/submit_train_fishtrack23_deimv2_dinov3_x_4gpu_aiq_gen001.sh
    prep: scripts/prep_all.sh
    data: >-
      FishTrack23-Latest/Train converted to kwcoco, sequence-disjoint
      train/vali; the corpus's own Test/ (72 sequences) as held-out test.
    binary: kwcoco-detector-kit docker image (reproducibility unit)
    gpus: 4
    variant: deimv2_dinov3_x
    classes: [fish]
    hyperparameters:
      input_hw: [1024, 1024]
      per_gpu_batch: 6        # total 24
      num_epochs: 20          # matches the RF-DETR baseline
      lr: 1e-3
      backbone_lr: 5e-5
      tiled_eval: false
    splits:
      train: {sequences: 439, images: 251143, annotations: 561572}
      vali:  {sequences: 46,  images: 35111,  annotations: 77230}
      test:  {sequences: 69,  images: 33434,  annotations: 84694}
    slurm_job: 293
    started_at: 2026-08-14T17:31:00-04:00
    stalled_at: 2026-08-15T12:43:00-04:00
    epochs_completed: 13   # of 20
    artifact: >-
      runs/deimv2_dinov3_x_1024x1024_fixed/best_stg2.pth  (epoch 12, 819 MB)
    image_kit_sha: e48ca1dab2a4-dirty   # STALE: 2026-06-21, 44 commits behind
    results:
      # HELD-OUT TEST split: the corpus's own Test/ directory, 69 sequences /
      # 33,434 images / 84,694 annotations that NEITHER model has seen. This is
      # the headline number and the only honest generalization measure any fish
      # detector on this corpus has had. Note iou_thresh=0.5, so it is an AP50.
      test_AP50: 0.7272
      test_AUC: 0.8504
      test_split: {sequences: 69, images: 33434, annotations: 84694}
      # Held-out sequence-disjoint VALI split (46 sequences, 35,111 images),
      # used for checkpoint selection during training.
      best_epoch: 12
      box_mAP_50_95: 0.5440
      box_mAP_50: 0.8060
      box_mAP_75: 0.5877
      AP_small: 0.184
      AP_medium: 0.252
      AP_large: 0.657
      AR_100: 0.631
      AR_50: 0.900
    notes:
      - Box-only. Segmentation is explicitly out of scope for this model.
      - >-
        Single-class, folded through the corpus's own Train/labels.txt -- the
        same file the RF-DETR baseline used -- so the two models are
        label-compatible by construction.
      - >-
        NO TILING, and none is needed: box percentiles over all 665,228 boxes
        are p1 42x44, p50 150x109 on 1920x1200 imagery, so a whole-frame resize
        to 1024 leaves the smallest boxes ~22 px wide.
      - >-
        DEADLOCKED at epoch 13 step 1500/10464 on 2026-08-15. Process stayed
        alive with all 4 GPUs at 100% utilization but only 78-81W of 300W --
        the signature of a spinning NCCL collective, not computation. No
        traceback, no OOM, no watchdog abort.
      - >-
        DIAGNOSED with py-spy against all four ranks' host PIDs while the job
        was still hung: every rank stopped in the identical frame,
        _engine_run_backward -> backward -> train_one_epoch
        (det_engine.py:68). That rules out a rank divergence (same call site),
        a dataloader deadlock (all past loading, feeder threads idle), and a
        dead rank (all four alive). It is a genuine NCCL all-reduce stall,
        plausibly transport- or driver-level on a very new stack: Blackwell
        RTX PRO 6000, driver 610.43.02, CUDA UMD 13.3, torch nightly cu132.
        py-spy --native could not unwind torch's binaries (UNW_EBADREG).
      - >-
        The NCCL watchdog could not fire: _sbatch_train.sh sets both
        TORCH_NCCL_HEARTBEAT_TIMEOUT_SEC=600 and TORCH_NCCL_BLOCKING_WAIT=1,
        and a blocking wait is exactly what the async watchdog cannot preempt.
        A 10-minute failure became a 2-day one. Affects every project using
        this launcher.
      - >-
        Epoch 4 diverged to NaN (AP exactly 0.0000, all-NaN tensor dumps
        03:35-05:47 UTC) and recovered by epoch 5. LR=1e-3 is at the edge of
        stable here -- the same value made sea-lion gen006 X@640 diverge
        without recovering. Do not raise it when increasing batch size.
      - >-
        Memory was over-provisioned 3x: ~16.5 GB of 96 GB per GPU actual, vs
        the ~49 GB predicted by area-scaling the sea-lion 1280px measurements.
        Room for batch 16-24/GPU, subject to the LR caution above.
      - >-
        Ran on the STALE image (kit e48ca1dab2a4-dirty, 2026-06-21) because it
        launched 13 minutes after the previous attempt failed -- no time to
        rebuild. Reproducible only against that image, and the -dirty tag means
        not reproducible from git. Rebuild before gen002; 6e81493 and 21b897f
        make a clean SHA possible.
      - >-
        Comparing like with like at AP50: DEIMv2 scores 0.7272 on the held-out
        Test/ split (never seen), 0.8060 on vali; RF-DETR reports 0.7166 on
        4,000 chips carved frame-level from its OWN training sequences. DEIMv2
        is ahead while being measured on strictly harder data, which is
        suggestive but not yet a head-to-head -- that needs RF-DETR run over
        the same Test/ bundle, which requires a VIAME inference pass and a
        reader for its alternating class/score CSV output.
      - >-
        The vali->test drop (0.8060 -> 0.7272 AP50) is the real generalization
        gap, and is exactly what the sequence-disjoint, deployment-grouped
        split exists to expose. A frame-level split would have concealed it.
      - >-
        Eval nearly cost 31 minutes twice: the first attempt finished inference
        over all 33,434 images and dumped a valid 223 MB pred_boxes.kwcoco.zip,
        then died in the pred-side bbox filter when `safer` called
        shutil.copymode on an already-removed temp file. Recovered by scoring
        from the saved predictions. _launch_export_score.sh now detects a
        complete predictions file and skips inference.
      - >-
        Eval emits exactly 300 predictions/image (score_thresh=0.001 filling a
        300 cap); median score 0.0107, only 0.5% above 0.05. Correct for
        faithful AP, but it is why the prediction artifact is 223 MB.
      - >-
        HEAD-TO-HEAD SETUP: RF-DETR's VIAME plugin applies its own score
        threshold, defaulting to 0.5 (viame/pytorch/rf_detr_detector.py:39),
        before anything reaches its output CSV -- the pipeline's visible
        class_probablity_filter of 0.0 gives no hint of it. Its first test run
        therefore emitted 67,377 detections (2.0/img, min score exactly 0.5000)
        against DEIMv2's 10,030,200 (300/img down to 0.0039). Comparing those
        directly would have favoured DEIMv2 on an artifact, since AP integrates
        over a recall curve the other model was not allowed to reach. Resolved
        by truncating DEIMv2 to the same 0.5 floor (56,231 preds, 1.7/img).
        Numbers from that comparison are AP AT A 0.5 SCORE FLOOR and are not
        comparable to the 0.7272 full-curve figure.
      - >-
        RF-DETR inference cost 0.515 s/img vs DEIMv2's 0.056 s/img on the same
        33,434 images (~9x). Not like-for-like -- RF-DETR chips each frame into
        overlapping 720px windows and computes masks -- but relevant for any
        video-rate deployment.
      - >-
        UNDER-TRAINED IN A SPECIFIC WAY, not simply too few epochs. The config
        resolved to epoches=20, flat_epoch=10, no_aug_epoch=2, so LR was still
        flat until epoch 10 and the cosine tail had barely started when the run
        died at 13. Separately, the augmentation policy is hardcoded to
        upstream's ~150-epoch defaults (epoch [4, 78, 148] in
        kwcoco_detector_kit/trainers/deimv2.py:379), so at 20 epochs only
        Mosaic ever stops and RandomPhotometricDistort / RandomZoomOut /
        RandomIoUCrop never turn off. The clean final phase the recipe is built
        around cannot happen at this schedule length. This is a kit-level bug
        affecting every short-schedule run, sea lions included -- and a
        near-miss, since deimv2.py:525-534 scales flat_epoch/no_aug_epoch for
        exactly this reason without applying it to the policy above.


  - id: fishtrack23_deimv2_dinov3_x_4gpu_aiq_gen002_warmstart
    status: failed
    purpose: >-
      Warm start from gen001's epoch-12 weights on a corrected 12-epoch
      schedule, to finish a schedule cleanly rather than resume a run whose
      checkpoint bookkeeping was already anomalous.
    entrypoint: scripts/submit_train_fishtrack23_deimv2_dinov3_x_4gpu_aiq_gen002_warmstart.sh
    gpus: 4
    variant: deimv2_dinov3_x
    classes: [fish]
    hyperparameters:
      input_hw: [1024, 1024]
      per_gpu_batch: 6        # total 24
      num_epochs: 12
      lr: 2e-4                # was 1e-3
      backbone_lr: 1e-5
      amp_dtype: float16
      aug_policy_epochs: [1, 6, 11]   # THE DEFECT -- see notes
    slurm_jobs: [297, 300, 301, 489]
    epochs_completed: 1     # of 12; epochs 1-11 produced AP 0.000
    artifact: >-
      runs/deimv2_dinov3_x_1024x1024_fixed/best_stg2.pth (epoch 1, vali
      AP 0.5443 -- the best number of any run at the time, reached after two
      epochs rather than thirteen). NOT poisoned by the NaN: DEIMv2 rewrites
      best_stg*.pth only on eval IMPROVEMENT, and a NaN model scores 0.0000.
    results:
      best_epoch: 1
      box_mAP_50_95: 0.5443
    notes:
      - >-
        ROOT CAUSE -- an augmentation boundary landed on collate_fn.stop_epoch.
        train_policy=fixed pins stop_epoch=1, and at `epoch == stop_epoch`
        DEIMv2 reloads model, optimizer, GradScaler and EMA state from
        best_stg1.pth (det_solver.py:83-86). Commit 2b3a911's policy scaling
        clamps e0 = max(1, ...), which lands on 1 for EVERY schedule shorter
        than ~80 epochs -- so the fix for short schedules quietly created a
        collision on all of them. The optimizer and fp16 loss scale were reset
        to their epoch-0 (NoAug) values at the exact step the input
        distribution changed to Mosaic/ZoomOut/IoUCrop.
      - >-
        Two runs, two NaN excursions, both in the FIRST epoch with
        augmentation enabled: gen001 at epoch 4 of [4, 78, 148], gen002 at
        epoch 1 of [1, 6, 11], each around step 7500 of 10464. gen001's
        reload was 3 epochs earlier, so the two events were separated, and it
        RECOVERED at epoch 5. gen002's collided and it never escaped.
      - >-
        NOT SELF-LIMITING. Once the weights are NaN every loss reads exactly
        0.0000, so the gradients are 0 and FINITE: GradScaler finds nothing to
        skip and upstream's `math.isfinite(loss_value)` guard 70 lines below
        never fires. Job 489 trained 11 further epochs to AP 0.000 on 4 GPUs
        at 3x the step time, because DEIMv2's NaN detector dumped an 819 MB
        NaN.pth and printed a 300x4 tensor EVERY step -- 500,000 log lines.
      - >-
        Job 489 also froze for 2 h 03 m mid-epoch between steps 4000 and 4500
        with no message. Unexplained; the same signature as job 296's 8.4x
        slow steps. GPU contention from a stray vLLM server remains the
        leading hypothesis and was never ruled in or out.
      - >-
        FIXED by a5cee5b (no augmentation boundary may coincide with
        stop_epoch) and DEIMv2 fork 32c3cd7 (abort on non-finite pred_boxes
        instead of dumping and continuing).

