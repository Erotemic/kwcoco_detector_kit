# HOLDOUT DISCIPLINE
# ===========================================================================
#
# test_AP50 / test_AUC appear in the gen001 and gen003 entries above because
# those runs were scored. They are NOT a selection signal and must not be used
# to choose a schedule, dtype, resolution, or checkpoint -- that is what vali
# is for.
#
# This is recorded because the rule was broken. Between 2026-08-23 and
# 2026-08-25 the test scores were used to argue four decisions, including the
# pivot to native-resolution tiling. All four have since been re-grounded on
# vali, and none reversed, but the holdout is less clean than two recorded
# scores would suggest.
#
# Contamination scope for the final report: SCORED twice (gen001 job 299,
# gen003 job 491), CONSULTED for decisions about four times, against a split of
# 69 sequences / 33,434 images / 84,694 annotations.
#
# Rule: decide on vali, score test once, on the model already chosen.
  - id: fishtrack23_deimv2_dinov3_x_4gpu_aiq_gen007_seqbalance
    status: planned          # written and tested; NOT launched
    purpose: >-
      Treat the corpus as 439 video sequences rather than 495,514 independent
      samples. gen006 ran the recipe correctly and still peaked at epoch 4 of
      14 while training loss kept falling -- a model fitting redundancy. This
      run changes what an epoch IS, not how long the schedule runs.
    entrypoint: scripts/submit_train_fishtrack23_deimv2_dinov3_x_4gpu_aiq_gen007_seqbalance.sh
    data: tiles_1024 (495,514 train tiles, 1229px source -> 1024 model)
    measured_imbalance:      # sequence_balance measure, on the real corpus
      sequence: {groups: 439, imbalance: 448, gini: 0.747, effective: 81}
      track:    {groups: 14103, imbalance: 4794, gini: 0.573, effective: 2963}
      frame:    {groups: 251143, imbalance: 2, gini: 0.013, effective: 249462}
      note: >-
        Effective counts are inverse-Simpson. Uniform sampling over 495,514
        tiles draws from something that behaves like 81 sequences and 2,963
        tracks. Frames are already uniform, so frame_alpha stays 0.
    hyperparameters:
      per_gpu_batch: 8        # global 32
      num_epochs: 28
      tail_epochs: 8          # 20 primary (60k) + 8 tail (24k); upstream's own
      epoch_length: 96000     # x28 / 32 = 84,000 updates
      sampling: without_replacement   # 96k UNIQUE tiles/epoch, 24k/rank
      lr: 2.5e-4              # halved from gen006, 50:1 ratio preserved
      backbone_lr: 5e-6
      amp_dtype: bfloat16
      aug_profile: tiled_light  # no Mosaic/ZoomOut/IoUCrop, no mixup/copyblend
      balance: {seq_alpha: 0.5, track_alpha: 0.5, empty_weight: 1.0,
                max_oversample: 8, seed: 0}
      recipe_at_28_epochs: {policy: [2, 12, 20], flat: 12, no_aug: 8,
                            stop: 20, matcher: 18, weight_decay: 1.25e-4}
    expected_effect:
      effective_sequences: 81 -> 238     # probability mass
      effective_tracks: 2963 -> 5306     # probability mass
      realized_effective_sequences: 80 -> 195   # actual 96k no-replacement draw
      realized_effective_tracks: 2901 -> 5461   # mean of 5 epochs
      max_draws_per_tile_per_epoch: 0.19 -> 1.55
      wasted_draws_per_epoch: 19.0% -> 0%     # measured, world_size 4
      negative_fraction_drawn: 21.1%          # corpus rate 20.8%
    notes:
      - >-
        alpha=0.5 not 1.0: at seq_alpha=1.0 effective tracks land at 2,893,
        BELOW the 2,963 they started at -- the whole sequence gain is paid for
        out of track diversity, because flattening pours mass into short
        sequences and short sequences are short precisely because they hold
        few tracks.
      - >-
        The first alpha sweep was scored with a broken metric that split each
        tile's weight across the tracks on it, reporting 1,454 effective tracks
        for a baseline whose true value is 2,963. Corrected: uniform weights
        now reproduce the unweighted count exactly, which is a test.
      - >-
        The tail is ABSOLUTE (8 epochs, upstream's own), not proportional.
        Scaling shrinks the consolidation phase exactly as the schedule
        shortens -- gen006's 14-epoch run got a 2-epoch tail.
      - >-
        Sampling WITHOUT replacement. Measured with replacement at 96k/495k,
        world_size 4: only 77,766 of 96,000 draws were unique -- 19.0% of every
        epoch spent re-showing a tile already seen that epoch.
      - >-
        Realized counts differ from probability mass: without replacement caps
        how much one sequence can be taken, so realized sequences are LOWER
        (195 vs 238) and realized tracks HIGHER (5,461 vs 5,306). Ordering is
        preserved; 0.5/0.5 stands. At seq_alpha=1.0 tracks do NOT fall below
        baseline under the realized draw (3,426 vs 2,901) -- that claim holds
        only for the mass metric.
      - >-
        kcd_sample_replacement was emitted by the trainer but never read by
        _solver.py, and the fix sat uncommitted IN the submodule so the tracked
        pointer lacked it. The Docker image bakes the submodule at its pointer,
        so a built image would have carried the bug. Fork 1e6339d, pointer
        advanced in cdd7dd6; a source-level contract test now requires every
        kcd_sample_* key to be read by the solver.
      - >-
        84k updates is a prior, not a law. gen006 peaked at epoch 4 ~= 62k and
        never beat it over the remaining ~155k. If the stride-8 gen006 epoch
        ranking peaks materially later, raise num_epochs.
      - >-
        Nothing is discarded. Weighted draw with replacement, redrawn each
        epoch; every tile keeps a strictly positive weight.

