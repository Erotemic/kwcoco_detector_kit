  - id: fishtrack23_deimv2_dinov3_x_4gpu_aiq_gen001
    status: ready
    purpose: >-
      Complementary box-only DEIMv2 detector for FishTrack23, trained through
      the kwcoco_detector_kit pipeline. Architecturally distinct from the
      existing RF-DETR model (DINOv3 backbone vs ViT; whole 1024px frames vs
      720px chips), and the first fish model on this corpus to be scored
      against genuinely held-out data.
    entrypoint: scripts/submit_train_fishtrack23_deimv2_dinov3_x_4gpu_aiq_gen001.sh
    prep: scripts/prep_all.sh
    data: >-
      FishTrack23-Latest/Train converted to kwcoco, sequence-disjoint
      train/vali; the corpus's own Test/ (72 sequences) as held-out test.
    binary: kwcoco-detector-kit docker image (reproducibility unit)
    gpus: 4
    variant: deimv2_dinov3_x
    classes: [fish]
    hyperparameters:
      input_hw: [1024, 1024]
      per_gpu_batch: 6        # total 24
      num_epochs: 20          # matches the RF-DETR baseline
      lr: 1e-3
      backbone_lr: 5e-5
      tiled_eval: false
    notes:
      - Box-only. Segmentation is explicitly out of scope for this model.
      - >-
        Single-class, folded through the corpus's own Train/labels.txt -- the
        same file the RF-DETR baseline used -- so the two models are
        label-compatible by construction.
      - >-
        NO TILING. Box percentiles over all 665,228 boxes are p1 42x44,
        p50 150x109 on 1920x1200 imagery, so a whole-frame resize to 1024
        leaves the smallest boxes ~22 px wide. This also means RF-DETR's
        small_box_area=75 (~8.7x8.7 px) deleted essentially nothing, contrary
        to the orientation journal's assumption.
      - >-
        Contamination RESOLVED: the corpus ships its own Test/ directory, and
        both RF-DETR runs trained with `-i .../Train` only, so that model
        provably never saw it. It is honest held-out data for both.
      - >-
        All generated data (frames, bundles, run workspaces) lives on the NVMe
        under $HOME/ssd-data/fish_kcd, not on /data (the md0 RAID array where
        the RF-DETR run's 771 GB of PNG frames and chip cache sat).
      - >-
        Selection criterion is detection AP on the held-out test split.
        Scoring is deferred until there are two deliverable models; a
        head-to-head additionally needs a VIAME inference pass for
        fish_detector.zip and a reader for its output CSV, neither of which
        exists in the kit yet.
