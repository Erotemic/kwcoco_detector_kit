    artifact: >-
      runs/deimv2_dinov3_x_1024x1024_fixed/best_stg1.pth (epoch 4), plus 14
      per-epoch checkpoints under staging/ with journal/train.jsonl
    results:
      # TILE-LEVEL vali (69,284 tiles). NOT comparable to gen001/gen003's
      # whole-image numbers -- different denominator, different object scale,
      # different protocol.
      epoch_ap: {0: 0.526, 1: 0.531, 2: 0.532, 3: 0.532, 4: 0.5329,
