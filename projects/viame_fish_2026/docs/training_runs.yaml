      box_mAP_50: 0.798
      box_mAP_75: 0.584
      AP_small: 0.192
      AP_medium: 0.254
      AP_large: 0.653
      AR_100: 0.634
      AR_50: 0.907
    vram:
      # torch.cuda.max_memory_allocated via MetricLogger, per GPU of 96 GB.
      peak_allocated_gb: 37.8
      working_set_gb: 1.26     # model + EMA + optimizer
      per_sample_gb: 2.28
      profile: >-
        36.9 GB at epoch 0 step 0 -> 37.8 GB by epoch 14, then flat. Turning
        augmentation on at epoch 2 added ~100 MB. No fragmentation creep over
        24 epochs. Batch 32/GPU would fit in ~77 GB.
    notes:
      - >-
        FIRST COMPLETED SCHEDULE on this corpus, and the first run with the
        stop_epoch collision fixed. No NaN excursion at any point.
      - >-
        THE HEADLINE: held-out test AP50 0.7285 vs gen001's 0.7272 on the
        identical split -- a marginal improvement, well inside noise. Vali went
        the other way (0.5406 vs 0.5440), so the vali deficit did NOT carry
        through to held-out data. Vali has been the weaker guide throughout.
      - >-
        Beware comparing vali across these runs. gen001's and gen002's numbers
        benefit from DEIMv2 reloading best_stg1.pth after every non-improving
        eval (det_solver.py:213-217), which repeatedly restores their best
        weights and produces a sawtooth loss curve. gen003 never leaned on
        that; its trajectory is monotone.
      - >-
        NOT update-starved, on the evidence that matters. The vali numbers
        suggest it (0.5406 on ~94k steps vs gen001's 0.5440 on ~136k), but on
        held-out test gen003 scored HIGHER on FEWER steps -- 0.7285 at ~94k vs
        0.7272 at ~136k. Per update it was the more efficient run. The batch
        increase (24 -> 64) bought throughput (57 -> 89 img/s) at 2.7x fewer
        steps per epoch and cost nothing measurable on test.
      - >-
        STILL CLIMBING AT THE END, though: vali over the last epochs ran 0.537,
        0.539, 0.540, 0.541 (peak, epoch 21) before the final NoAug epoch. That
        -- not update starvation -- is the case for gen004's longer schedule.
      - >-
        bf16 WAS A MISTAKE and the default has been reverted (DEIMv2 fork
        4d7d253). DEIMv2 is an fp16 recipe: no bfloat16 anywhere in its
        training path, a GradScaler constructed unconditionally (fp16
        underflow machinery, a vestige under bf16), and every published COCO
        number from plain `--use-amp`. bf16 also costs three mantissa bits
        (7 vs 10) in a model whose localization is fine-grained-distribution
        based (reg_max=32, loss_fgl, loss_ddf). It was adopted to prevent NaN
        excursions that the collision already explains.
      - >-
        The post-training scoring pass in job 490 died on its first image with
        "TypeError: Got unsupported ScalarType BFloat16" -- numpy has float16
        but no bfloat16, so every .numpy() downstream of the eval autocast
        worked for exactly as long as that autocast was fp16. Fixed in 03e48a9
        by casting floating outputs to float32 in DEIMv2Predictor._forward.
        Training was never at risk; job 491 re-scored the finished checkpoint.
      - >-
        AP dipped at epoch 14 (0.536 -> 0.523), two epochs after the aug stage
        change and the start of cosine decay at epoch 12, then recovered to its
        peak by epoch 21. The final NoAug epoch 23 fell to 0.526; best_stg2
        captured epoch 21 regardless.

  - id: fishtrack23_deimv2_dinov3_x_4gpu_aiq_gen004_long
    status: killed
    purpose: >-
      48-epoch fp16 run to test schedule length. Killed at epoch 21 after it
      became clear the run could not accumulate progress.
    entrypoint: scripts/submit_train_fishtrack23_deimv2_dinov3_x_4gpu_aiq_gen004_long.sh
    slurm_jobs: [492]
    hyperparameters: {per_gpu_batch: 16, num_epochs: 48, flat_epoch: 24,
                      lr: 5e-4, backbone_lr: 1e-5, amp_dtype: float16,
                      aug_policy_epochs: [2, 25, 47]}
    epochs_completed: 21    # of 48
    results: {best_epoch: 1, box_mAP_50_95: 0.5342}
    notes:
      - >-
        NEVER BEAT ITS OWN EPOCH-1 SCORE in 21 epochs. best_stg2.pth was
        written once, at epoch 1, and never advanced.
      - >-
        ROOT CAUSE -- det_solver.py:213 reloads the full training state after
        every non-improving eval, and it reloaded best_stg1.pth, which is only
        WRITTEN while `epoch < stop_epoch`. With the kit's stop_epoch=1 that
        file is frozen at EPOCH 0 forever, so each reload reset the model,
        optimizer, GradScaler, EMA and LR warmup back to epoch 0. It fired at
        epochs 2, 7, 13 and 19; AP sawtoothed back to ~0.52 each time.
        Fixed in DEIMv2 fork d89309f by preferring best_stg2.pth.
      - >-
        gen003 survived the same mechanism only because its cosine phase
        improved monotonically so the branch seldom fired. Its epoch-14 and
        epoch-23 dips, previously attributed to the augmentation stage change
        and the final NoAug epoch, were this.
      - >-
        SECOND DEFECT -- flat_epoch was hardcoded to num_epochs//2, so 48
        epochs bought 24 epochs of constant LR, the regime where the model
        oscillates and trips the reload. KCD_FLAT_EPOCH now decouples them
        (45eda73).

  - id: fishtrack23_deimv2_dinov3_x_4gpu_aiq_gen005_tiled1024
    status: failed
    purpose: >-
      First native-resolution run. 1024px windows cut from full-res frames and
      fed 1:1 to the model, eliminating the 0.533x horizontal squash and
      1.6-1.78x aspect distortion every previous run trained under.
    entrypoint: scripts/submit_train_fishtrack23_deimv2_dinov3_x_4gpu_aiq_gen005_tiled1024.sh
    slurm_jobs: [494, 496]   # 494 tiling, 496 train
    tiling:
      window: 1024            # RF-DETR's VIAME baseline uses 720
      stride_frac: 0.75       # 768 px stride, 25% overlap
      source_scales: [1.0]
      train_tiles: 495514     # 1.97/frame, NOT the 5.87 predicted
      train_annotations: 780566
      empty_tiles: 111835     # 22.6%
      disk_gb: 59
    hyperparameters: {per_gpu_batch: 16, num_epochs: 24, flat_epoch: 8,
                      lr: 5e-4, backbone_lr: 1e-5, amp_dtype: float16,
                      aug_policy_epochs: [2, 12, 23], tiled_eval: true}
    epochs_completed: 3     # of 24
    results:
      best_epoch: 1
      box_mAP_50_95: 0.5304   # TILE-level vali -- NOT comparable to earlier runs
    notes:
      - >-
        THE NaN GUARD DID ITS JOB. Aborted at epoch 3 step 2874 with a named
        error instead of training 21 more epochs to AP 0.000. Cost ~5.7 h
        rather than a weekend.
      - >-
        THE best_stg2 RELOAD FIX IS CONFIRMED LIVE: "Refresh EMA at epoch 2
        with decay 0.9998 (restored best_stg2.pth)". First run in this project
        to restore the actual best model rather than epoch 0.
      - >-
        SCHEDULE SIZING WAS ACCURATE: epoch 0 wall 1:32:50 against a 93 min
        estimate; cycle 1:43:50 against 103 min.
      - >-
        DECISION BASIS: bf16 is chosen on training-time evidence (NaN counts,
        completed schedules), not on the held-out test scores. An earlier
        version of this note cited test; see the holdout-discipline rule in
        scripts/paths.sh.
      - >-
        THIRD fp16 NaN, same signature every time -- sudden onset at stable
        loss, inside an augmented epoch. gen001 e4 s7500 (loss 36.5), gen002
        e1 s7700 (31.5), gen005 e3 s2874 (34.4). bf16 has never produced one
        and is the only configuration to complete a schedule (gen003, 22
        augmented epochs). gen005 relaunches on bf16.
      - >-
        Tiling plausibly raises the rate: tiles already carry edge-truncated
        boxes (min_keep_fraction 0.20) and RandomIoUCrop/RandomZoomOut then
        crop a crop. If bf16 also fails, the augmentation stack is the next
        lever, not the dtype.
      - >-
        AP dropped 0.530 -> 0.461 at epoch 2, the first augmented epoch. Worth
