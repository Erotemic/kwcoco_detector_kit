    entrypoint: scripts/submit_train_fishtrack23_deimv2_dinov3_x_4gpu_aiq_gen006_final.sh
    slurm_jobs: [498]
    started_at: 2026-08-25T16:52:00-04:00
    finished_at: 2026-08-26T23:19:00-04:00
    epochs_completed: 14     # of 14 -- .train_complete written
    wall_time: 27.9h train / 30.4h span (56h limit)
    data: tiles_1024 (495,514 train / 69,284 vali tiles, 1229px source -> 1024 model)
