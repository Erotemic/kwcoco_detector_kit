# Class-collapse schemes for sea lion detector training.
#
# Each scheme maps source category names (from the v2 *_norm.kwcoco.zip
# bundles) to a target category name. `drop` lists source names that
# are excluded entirely from the training/val/test kwcoco. `drop_reasons`
# documents why.
#
# Per-scheme fields:
#   target_order        ordered list defining class-index assignment for
#                       the trained model (i-th name -> class index i).
#                       Reordering is a breaking change for any trained
#                       checkpoint.
#   mapping             source category name -> target class name.
#   drop                source category names excluded from the training
#                       data entirely (no annotation written).
#   distractor_classes  OPTIONAL list of target class names that are kept
#                       in the model's class set (so it learns to
#                       discriminate them) but excluded from class-
#                       agnostic detection AP at eval time. Per-class AP
#                       on these classes is still reported as a
#                       diagnostic. The kit's eval step reads this field
#                       and runs an extra scoring pass with these classes
#                       pruned from both GT and predictions.
#
# Source distribution (475,651 annotations total across train+vali+test
# of v2 splits on the full 2007-2024 corpus). For per-class counts see
# docs/splits_v2_design.md and unpacked/coco_annot_stats/.
#
# 2026-06-05: rewrote keys from letter codes (B/S/F/J/P/NFS/O/DP/DN) to
# full normalized names. The letter-code system was a training_ready_v1
# artifact (annotations collapsed to a single 'sealion' category with
# the letter code stashed in a source_category field). The v2 *_norm
# bundles produced by /data/Public/VIAME/viame_sealions_2026/scripts/
# sealion_pipeline.py expose categories as first-class kwcoco categories
# with full names (CLASS_ALIASES is the source of truth for the
# normalization), so the scheme tooling now reads category names
# directly.

schemes:

  single_sealion:
    description: All positives collapsed to a single 'sealion' class. P0 baseline.
    num_classes: 1
    # Order here defines the class index assigned by the trained model
    # (i-th class -> integer label i). Downstream code reads this list,
    # not the mapping's value-iteration order, so reordering `mapping`
    # below is safe but reordering `target_order` is a breaking change
    # for any already-trained checkpoint.
    target_order: [sealion]
    mapping:
      bull:           sealion
      subadult_male:  sealion
      female:         sealion
      juvenile:       sealion
      pup:            sealion
      dead_pup:       sealion
    drop: [northern_fur_seal, negative, dead_nonpup]
    drop_reasons:
      northern_fur_seal: |
        Different species; not a target. This scheme has no slot for
        NFS as a separate class, so we drop the annotations entirely.
        A future variant could carry NFS as a distractor class (cf.
        lifestage_6cls.distractor_classes) — but that's the 6-class
        scheme, not this one.
      negative:    background hard-negative annotations; not a positive target
      dead_nonpup: only 49 instances across the full corpus, too few to be useful

  pup_vs_nonpup:
    description: Two-class operational split — pup vs adult/juvenile sealion.
    num_classes: 2
    target_order: [pup, nonpup_sealion]
    mapping:
      pup:           pup
      bull:          nonpup_sealion
      subadult_male: nonpup_sealion
      female:        nonpup_sealion
      juvenile:      nonpup_sealion
    drop: [northern_fur_seal, negative, dead_pup, dead_nonpup]
    drop_reasons:
      northern_fur_seal: different species, kept as future hard-negative source
      negative:          background-only annotations
      dead_pup:          rare and ambiguous between pup vs dead non-pup; revisit
      dead_nonpup:       only 49 instances across the full corpus, too few

  lifestage_6cls:
    description: Full operational age-sex classifier plus species distractor.
    num_classes: 6
    target_order: [bull, subadult_male, female, juvenile, pup, northern_fur_seal]
    # Distractor classes: classes the model *learns to detect* (so it can
    # discriminate them from the operational targets) but which the mission
    # treats as non-targets. They are excluded from class-agnostic detection
    # AP at eval time. Per-class AP for these classes is still reported as
    # a diagnostic so we can see how well the discrimination is being
    # learned.
    distractor_classes: [northern_fur_seal]
    mapping:
      bull:              bull
      subadult_male:     subadult_male
      female:            female
      juvenile:          juvenile
      pup:               pup
      northern_fur_seal: northern_fur_seal
    drop: [negative, dead_pup, dead_nonpup]
    drop_reasons:
      negative:    background-only annotations
      dead_pup:    ambiguous; revisit if a per-class fine-tune is worthwhile
      dead_nonpup: only 49 instances corpus-wide
